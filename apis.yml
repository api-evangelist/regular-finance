name: Regular Finance
description: >-
  Regular Finance (Regular) is a French fintech offering a consumer digital-asset
  yield account. Customers deposit euros by bank transfer and earn roughly 5.50%
  annual interest paid daily, backed by regulated stablecoins such as EURC and USDC
  placed into on-chain liquidity pools and yield protocols. Withdrawals are free at
  any time and no crypto knowledge is required. Regular is a Techstars-backed company
  headquartered in France; the product is entirely consumer-facing (web and mobile app
  at app.regular.eu) and publishes no public developer API, SDK, MCP server, or
  technical documentation surface at this time.
